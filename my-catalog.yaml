version: 2
name: bigip-catalog
displayName: F5 BIG-IP MCP Catalog
registry:
  f5-bigip:
    description: "F5 BIG-IP iControl REST API - Manage virtual servers, pools, nodes, monitors, iRules, VLANs, GTM, and more"
    title: "F5 BIG-IP"
    type: server
    image: bigip-mcp:latest
    ref: ""
    source: "https://clouddocs.f5.com/api/icontrol-rest/"
    icon: ""
    secrets:
      - name: BIGIP_PASSWORD
        env: BIGIP_PASSWORD
        description: "BIG-IP admin password"
    tools:
      - name: get_device_info
      - name: get_system_provision
      - name: get_failover_status
      - name: get_sync_status
      - name: sync_config
      - name: save_config
      - name: get_system_clock
      - name: get_system_dns
      - name: get_system_ntp
      - name: get_system_license
      - name: list_virtual_servers
      - name: get_virtual_server
      - name: create_virtual_server
      - name: modify_virtual_server
      - name: delete_virtual_server
      - name: list_pools
      - name: get_pool
      - name: create_pool
      - name: modify_pool
      - name: delete_pool
      - name: list_pool_members
      - name: add_pool_member
      - name: remove_pool_member
      - name: set_pool_member_state
      - name: list_nodes
      - name: get_node
      - name: create_node
      - name: delete_node
      - name: set_node_state
      - name: list_monitors
      - name: get_monitor
      - name: list_irules
      - name: get_irule
      - name: list_profiles
      - name: list_persistence_profiles
      - name: list_data_groups
      - name: get_data_group
