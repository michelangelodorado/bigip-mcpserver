services:
  bigip-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigip-mcp
    command: ["http"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
